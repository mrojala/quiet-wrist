name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Without the secret the build falls back to the throwaway debug key, which
      # still installs but cannot upgrade an existing install in place.
      - name: Decode signing keystore
        env:
          KEYSTORE_P12_BASE64: ${{ secrets.KEYSTORE_P12_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_P12_BASE64" ]; then
            printf '%s' "$KEYSTORE_P12_BASE64" | tr -d '[:space:]' | base64 -d > app/release.p12
            echo "Release keystore decoded."
          else
            echo "No KEYSTORE_P12_BASE64 secret set; falling back to the debug key."
          fi

      - name: Assemble release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: quietwrist
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Name the APK after its version
        id: apk
        run: |
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          dest="QuietWrist-0.1.${{ github.run_number }}.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: QuietWrist-apk
          path: ${{ steps.apk.outputs.path }}

      # One stable URL to open on the phone:
      # https://github.com/mrojala/quiet-wrist/releases/latest
      - name: Publish to the rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Newest QuietWrist build from `main` (${{ github.sha }}).

            Open this page on the phone and tap the `.apk` to install.
          make_latest: true
          files: ${{ steps.apk.outputs.path }}
