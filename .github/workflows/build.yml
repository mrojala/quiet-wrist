name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      application_id:
        description: >-
          Experiment only: build under this application id instead of
          com.mrojala.quietwrist, to borrow the identity of an app on Huawei
          Health's quick-reply whitelist. Publishes to the separate "experiment"
          release and never touches "latest". Leave blank for a normal build.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Keyed on the application id too: an experiment dispatch on main must not cancel
  # the release build for a merge, which is what happens when both share a group.
  group: build-${{ github.ref }}-${{ inputs.application_id || 'default' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Without the secret the build falls back to the throwaway debug key, which
      # still installs but cannot upgrade an existing install in place.
      - name: Decode signing keystore
        env:
          KEYSTORE_P12_BASE64: ${{ secrets.KEYSTORE_P12_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_P12_BASE64" ]; then
            printf '%s' "$KEYSTORE_P12_BASE64" | tr -d '[:space:]' | base64 -d > app/release.p12
            echo "Release keystore decoded."
          else
            echo "No KEYSTORE_P12_BASE64 secret set; falling back to the debug key."
          fi

      - name: Assemble release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          APPLICATION_ID: ${{ inputs.application_id }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: quietwrist
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      # A fixed filename, so each build replaces the previous asset instead of
      # piling up, and the download link never changes. The version is in the
      # release notes and on the app's own screen.
      - name: Collect the APK
        id: apk
        run: |
          mkdir -p out
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -n "${{ inputs.application_id }}" ]; then
            name=QuietWrist-EXP.apk
          else
            name=QuietWrist.apk
          fi
          cp "$apk" "out/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: QuietWrist-apk
          path: out/${{ steps.apk.outputs.name }}

      # One stable URL to open on the phone:
      # https://github.com/mrojala/quiet-wrist/releases/latest
      - name: Publish to the rolling "latest" release
        if: github.ref == 'refs/heads/main' && inputs.application_id == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            QuietWrist **0.1.${{ github.run_number }}** — built from `main` (${{ github.sha }}).

            Open this page on the phone and tap `QuietWrist.apk` to install. It
            upgrades any previous version in place.
          make_latest: true
          files: out/QuietWrist.apk

      # Kept off "latest" so the normal install link is never an experiment.
      - name: Publish the experiment build
        if: inputs.application_id != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experiment
          name: Experiment build
          body: |
            QuietWrist **0.1.${{ github.run_number }}** built as
            `${{ inputs.application_id }}`, from `${{ github.sha }}`.

            Testing whether Huawei Health opens quick reply for this package name.
            Installs as a **separate app** called "QuietWrist EXP" — grant
            notification access to only one QuietWrist at a time, or every message
            relays twice.

            Sideload only. Never publish a build from this release anywhere.
          prerelease: true
          make_latest: false
          files: out/QuietWrist-EXP.apk
